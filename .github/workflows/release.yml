on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release and Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Stamp version & run tests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^export DC_VERSION=.*/export DC_VERSION=v${VERSION}/" dc
          sed -i "s/^# Version .*/# Version ${VERSION}/" dc-completion
          bash ./tools/test.sh
      - name: Build dc-release
        run: |
          zip --junk-paths dc-release dc-completion dc README.md CHANGELOG.md
      - name: Create Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk '/^# Version /{if (c++) exit} c' CHANGELOG.md > /tmp/release-notes.md
          gh release create "${GITHUB_REF_NAME}" dc-release.zip \
            --title "${GITHUB_REF_NAME}" \
            -F /tmp/release-notes.md \
            --generate-notes
